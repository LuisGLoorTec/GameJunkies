<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Inicio</title>
    <link rel="icon" href="img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style/main.css">
</head>
<body>
 
    <main class="container-fluid px-4 mt-2">         

        <div id="carruselJuegos" class="carousel slide carrusel-contenedor mb-5" data-bs-ride="carousel">         
            <div class="carousel-indicators"></div>                  
            <div class="carousel-inner"></div>                  
            <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev" style="z-index: 5;">             
                <span class="carousel-control-prev-icon"></span>         
            </button>         
            <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next" style="z-index: 5;">             
                <span class="carousel-control-next-icon"></span>         
            </button>     
        </div>     
    </main>          
    
    <div class="container-fluid px-4">         
        
        <div class="row mb-4 align-items-center">             
            <div class="col-12 d-flex justify-content-between align-items-center">                 
                <h2 id="titulo-estrenos" class="mb-0 fw-bold d-flex align-items-center gap-2" style="color: var(--color-principal);"><img src="img/GiftRecurses/flame-lit.gif" style="width: 36px; height: 36px; object-fit: contain;" alt="Fuego"> Últimos Estrenos</h2>
                

                <div>
                    <button class="btn btn-tema-custom rounded-circle me-2" type="button" data-bs-target="#carruselEstrenosMulti" data-bs-slide="prev" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
                        <span aria-hidden="true" style="font-size: 1.5rem;">‹</span>
                    </button>
                    <button class="btn btn-tema-custom rounded-circle" type="button" data-bs-target="#carruselEstrenosMulti" data-bs-slide="next" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
                        <span aria-hidden="true" style="font-size: 1.5rem;">›</span>
                    </button>
                </div>
            </div>             
        </div>         
        
        <div id="carruselEstrenosMulti" class="carousel slide mb-5" data-bs-interval="false">
            <div class="carousel-inner" id="contenedor-estrenos-inner">
            </div>
        </div>
        
        <hr class="mb-5" style="border-color: var(--borde-sutil);">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="titulo-catalogo" class="mb-0 d-flex align-items-center gap-2"><img src="img/GiftRecurses/Link.gif" style="width: 42px; height: 42px; object-fit: contain;" alt="Link"> Video Juegos Destacados</h2>
            <a href="HTML/Catalogo.html" class="btn btn-outline-success fw-bold">Ver más juegos</a>
        </div>
        
        <div id="contenedor-juegos-grilla" class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4 mb-4">         
        </div>     
        


        <!-- Sección Subastándose Ahora -->
        <div class="mt-5 pt-4 border-top" style="border-color: var(--borde-sutil) !important;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0 d-flex align-items-center gap-2"><span class="material-symbols-outlined text-warning" style="font-size: 2.5rem;">gavel</span> Subastándose Ahora</h2>
                <a href="HTML/Subastas.html" class="btn btn-outline-warning fw-bold">Ver todas las subastas</a>
            </div>
            <div id="contenedor-inicio-subastas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-4 justify-content-center">
                <!-- Se inyecta por JS -->
            </div>
        </div>

        <!-- Sección Merch y Ropa -->
        <div class="mt-5 pt-4 border-top mb-5" style="border-color: var(--borde-sutil) !important;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0 d-flex align-items-center gap-2"><span class="material-symbols-outlined text-info" style="font-size: 2.5rem;">checkroom</span> Merch y Ropa que te podría interesar</h2>
                <a href="HTML/Merch.html" class="btn btn-outline-info fw-bold">Ver todo el merch</a>
            </div>
            <div id="contenedor-inicio-merch" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4 mb-4">
                <!-- Se inyecta por JS -->
            </div>
        </div>

    </div>     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>     
    <script src="JavaScript/layout.js"></script>
    <script src="JavaScript/carrito.js"></script>
    <script src="JavaScript/auth.js"></script>
    <script src="JavaScript/deseos.js"></script>
    <script src="JavaScript/api_rawg.js"></script> 
    <script src="JavaScript/datosMerch.js"></script>
    <script src="JavaScript/inicio_extras.js"></script>
</body> 
</html>
