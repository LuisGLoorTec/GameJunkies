<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merch y Ropa - GameJunkies</title>
    <!-- CSS Bootstrap y Personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
    <style>
        .tarjeta-img-contenedor {
            height: 250px;
            position: relative;
            background-color: #1a1a1a;
        }
        .tarjeta-img-contenedor img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-anadir-merch {
            background-color: var(--color-secundario);
            color: #ffffff;
            border-radius: 8px;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }
        .btn-anadir-merch:hover {
            opacity: 0.9;
            color: #ffffff;
        }
        .badge-categoria {
            background-color: var(--color-secundario);
            color: #ffffff;
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body style="background-color: var(--fondo-oscuro); color: var(--texto-principal);">

    <!-- Contenedor del Navbar dinámico -->
    <div id="navbar-container"></div>

    <main class="container py-5 mt-5">
        
        <!-- Header de la sección -->
        <div class="row mb-5 align-items-center">
            <div class="col-md-8">
                <h1 class="mb-0 fw-bold d-flex align-items-center gap-2" style="color: var(--color-principal);">
                    <span class="material-symbols-outlined fs-1 text-warning">checkroom</span> Merch & Ropa
                </h1>
                <p class="text-muted mt-2">Vístete como un verdadero gamer. Explora nuestra colección oficial de ropa, figuras y accesorios.</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <p class="text-muted mb-0"><span id="contador-merch">12</span> productos disponibles</p>
            </div>
        </div>

        <!-- Grid de Merch -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="contenedor-merch">
            <!-- Se inyectará desde JavaScript -->
        </div>
    </main>

    <!-- Contenedor del Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Scripts Core -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts Propios -->
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/asistente.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <!-- Script de Merch -->
    <script src="../JavaScript/datosMerch.js"></script>
    <script>
        // Renderizar el catálogo de Merch usando la Mini API local
        document.addEventListener('DOMContentLoaded', () => {
            const contenedor = document.getElementById('contenedor-merch');
            if (contenedor && typeof catalogoMerch !== 'undefined') {
                contenedor.innerHTML = '';
                catalogoMerch.forEach(item => {
                    const esRopa = item.categoria === 'Ropa';
                    contenedor.innerHTML += `
                        <div class="col">
                            <div class="card card-game h-100 shadow-sm" style="background-color: var(--panel-oscuro); border-color: transparent;" onclick="window.location.href='DetallesMerch.html?id=${item.id}'">
                                <div class="tarjeta-img-contenedor">
                                    <span class="badge position-absolute top-0 end-0 m-3 badge-categoria">${item.categoria}</span>
                                    <img src="../img/merch/${item.img}" alt="${item.nombre}">
                                </div>
                                <div class="card-body d-flex flex-column p-4">
                                    <h5 class="card-title fw-bold text-truncate mb-3" style="color: var(--texto-principal);">${item.nombre}</h5>
                                    
                                    <div class="mt-auto d-flex justify-content-between align-items-center">
                                        <span class="fw-bold fs-4 text-precio" style="color: var(--color-naranja) !important;">$${item.precio}</span>
                                        <button class="btn btn-anadir-merch d-flex align-items-center gap-2 px-3 py-2" onclick="event.stopPropagation(); if(window.agregarAlCarrito) window.agregarAlCarrito('${item.id}', '${item.nombre}', '${item.precio}', '../img/merch/${item.img}', 'Merch')">
                                            Añadir <span class="material-symbols-outlined fs-6">shopping_cart</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
        });
    </script>
</body>
</html>
