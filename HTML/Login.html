<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Iniciar Sesión</title>
    <link rel="icon" href="../img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>
    <main class="container mt-5 mb-5 d-flex justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="card p-5 shadow-lg border-0 rounded-4" style="background-color: var(--panel-oscuro); max-width: 500px; width: 100%;">
            <h2 class="text-center mb-4" style="color: var(--texto-principal);">Bienvenido de nuevo</h2>
            <form id="form-login-full">
                <div class="mb-3">
                    <label for="login-full-email" class="form-label" style="color: var(--texto-principal);">Correo Electrónico</label>
                    <input type="email" class="form-control input-busqueda" id="login-full-email" placeholder="usuario@ejemplo.com" required>
                </div>
                <div class="mb-4">
                    <label for="login-full-password" class="form-label" style="color: var(--texto-principal);">Contraseña</label>
                    <input type="password" class="form-control input-busqueda" id="login-full-password" placeholder="********" required>
                </div>
                <button type="submit" class="btn btn-principal w-100 py-2 fs-5">Ingresar</button>
                <div class="text-center mt-3" style="color: var(--texto-apagado);">
                    ¿No tienes una cuenta? <a href="Registro.html" style="color: var(--color-principal); text-decoration: none;">Regístrate aquí</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/auth.js"></script>
</body>
</html>
