<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Inicio</title>
    <link rel="icon" href="../img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>
 
    <main class="container-fluid px-4 mt-2">         

        <div id="carruselJuegos" class="carousel slide carrusel-contenedor mb-5" data-bs-ride="carousel">         
            <div class="carousel-indicators"></div>                  
            <div class="carousel-inner"></div>                  
            <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev" style="z-index: 5;">             
                <span class="carousel-control-prev-icon"></span>         
            </button>         
            <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next" style="z-index: 5;">             
                <span class="carousel-control-next-icon"></span>         
            </button>     
        </div>     
    </main>          
    
    <div class="container-fluid px-4">         
        
        <div class="row mb-4 align-items-center">             
            <div class="col-12 d-flex justify-content-between align-items-center">                 
                <h2 id="titulo-estrenos" class="mb-0 fw-bold" style="color: var(--color-principal);">🔥 Últimos Estrenos</h2>
                
                <!-- Controles del Carrusel de Estrenos -->
                <div>
                    <button class="btn btn-outline-light rounded-circle me-2" type="button" data-bs-target="#carruselEstrenosMulti" data-bs-slide="prev" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
                        <span aria-hidden="true" style="font-size: 1.5rem;">‹</span>
                    </button>
                    <button class="btn btn-outline-light rounded-circle" type="button" data-bs-target="#carruselEstrenosMulti" data-bs-slide="next" style="width: 40px; height: 40px; padding: 0; line-height: 1;">
                        <span aria-hidden="true" style="font-size: 1.5rem;">›</span>
                    </button>
                </div>
            </div>             
        </div>         
        
        <div id="carruselEstrenosMulti" class="carousel slide mb-5" data-bs-ride="carousel" data-bs-interval="5000">
            <div class="carousel-inner" id="contenedor-estrenos-inner">
                <!-- Se inyectarán los slides aquí -->
            </div>
        </div>
        
        <hr class="mb-5" style="border-color: var(--borde-sutil);">

        <div class="row mb-4 align-items-center">             
            <div class="col-md-8">                 
                <h2 id="titulo-catalogo" class="mb-0">Video Juegos Destacados</h2>             
            </div>             
            <div class="col-md-4">                 
                <select id="filtro-categoria" class="form-select select-filtro">                     
                    <option value="todos">Todos los géneros</option>                     
                    <option value="accion">Acción</option>                     
                    <option value="rpg">RPG</option>                     
                    <option value="shooter">Shooter</option>                     
                    <option value="merch">Merch & Ropa</option>                 
                </select>             
            </div>         
        </div>         
        
        <div id="contenedor-juegos-grilla" class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4 mb-4">         
        </div>     
        
        <div class="text-center mb-5" id="btn-ver-mas-container">
            <a href="Catalogo.html" class="btn btn-outline-light btn-lg fw-bold px-5 py-2" style="border-width: 2px;">VER MÁS JUEGOS</a>
        </div>
        
        <div id="contenedor-merch-grilla" class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-4 mb-5" style="display: none;">
        </div>

    </div>     
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>     
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/deseos.js"></script>
    <script src="../JavaScript/api_rawg.js"></script> 
</body> 
</html>
