<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Inicio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
    

</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand text-white d-flex flex-column lh-1" href="#">
                <span>GAME</span>
                <span>JUNKIES</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarPrincipal">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <li class="nav-item me-3">
                        <input type="text" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Buscar juego o merch...">
                    </li>
                    <li class="nav-item"><a class="nav-link" href="#">Catalogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Subastas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
                    <li class="nav-item ms-2">
                        <a class="btn btn-outline-light btn-sm" href="#">Carrito (0)</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h1 class="text-center">Bienvenido a GameJunkies</h1>
    </main>
    <!-- Carrusel de Destacados (Funcionalidad 5) -->
<div id="carruselJuegos" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-indicators">
    </div>
    
    <div class="carousel-inner rounded shadow-sm">
    </div>
    
    <button class="carousel-control-prev" type="button" data-bs-target="#carruselJuegos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carruselJuegos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JavaScript/apiprueba.js"></script>

<!-- Seccion de Catalogo y Busqueda -->
<div class="row mb-4 align-items-center">
    <div class="col-md-8">
        <h2 class="mb-0">Catalogo Destacado</h2>
    </div>
    <div class="col-md-4">
        <!-- Filtros (Funcionalidad 6) -->
        <select class="form-select bg-dark text-white border-secondary">
            <option value="todos">Todos los generos</option>
            <option value="accion">Accion</option>
            <option value="rpg">RPG</option>
            <option value="shooter">Shooter</option>
            <option value="merch">Merch & Ropa</option>
        </select>
    </div>
</div>

<!-- Grilla de Productos -->
<div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 mb-5">
    <!-- Tarjeta Producto 1 -->
    <div class="col">
        <div class="card h-100 bg-dark text-white border-secondary">
            <img src="https://via.placeholder.com/300x400/1e1e2f/ffffff?text=Overwatch+2" class="card-img-top" alt="Overwatch 2">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Overwatch</h5>
                <p class="card-text text-success fw-bold">29.99</p>
                <button class="btn btn-outline-light mt-auto" style="border-color: var(--primary-purple);">Ver detalles</button>
            </div>
        </div>
    </div>
    <!-- Tarjeta Producto 2 -->
    <div class="col">
        <div class="card h-100 bg-dark text-white border-secondary">
            <img src="https://via.placeholder.com/300x400/1e1e2f/ffffff?text=Resident+Evil+Village" class="card-img-top" alt="RE Village">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Resident Evil 2 Remake</h5>
                <p class="card-text text-success fw-bold">$39.99</p>
                <button class="btn btn-outline-light mt-auto" style="border-color: var(--primary-purple);">Ver detalles</button>
            </div>
        </div>
    </div>
    <!-- Tarjeta Producto 3 -->
    <div class="col">
        <div class="card h-100 bg-dark text-white border-secondary">
            <img src="https://via.placeholder.com/300x400/1e1e2f/ffffff?text=Merch+Blue+Lock" class="card-img-top" alt="Merch Blue Lock">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Camiseta de Malenia elden ring</h5>
                <p class="card-text text-success fw-bold">$27.99</p>
                <button class="btn btn-outline-light mt-auto" style="border-color: var(--primary-purple);">Ver detalles</button>
            </div>
        </div>
    </div>
    <!-- Tarjeta Producto 4 -->
    <div class="col">
        <div class="card h-100 bg-dark text-white border-secondary">
            <img src="https://via.placeholder.com/300x400/1e1e2f/ffffff?text=Lookism+Vol+1" class="card-img-top" alt="Lookism">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Manga Lookism Vol 1</h5>
                <p class="card-text text-success fw-bold">$14.99</p>
                <button class="btn btn-outline-light mt-auto" style="border-color: var(--primary-purple);">Ver detalles</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Aqui pondremos la logica en JS puro mas adelante
        console.log("GameJunkies inicializado");
    </script>
</body>
</html>
