<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Subastas</title>
    <link rel="icon" href="../img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
    <style>
        .tiempo-restante {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-naranja);
            letter-spacing: 1px;
            text-shadow: 0px 0px 10px rgba(232, 121, 12, 0.4);
        }
        .bid-input {
            background-color: var(--fondo-oscuro) !important;
            border: 1px solid var(--borde-sutil) !important;
            color: var(--texto-principal) !important;
            font-weight: bold;
        }
        .bid-input:focus {
            border-color: var(--color-principal) !important;
            box-shadow: 0 0 0 0.25rem rgba(118, 88, 153, 0.25) !important;
        }
        
        /* Animación de destello al recibir una nueva puja (Simulación) */
        @keyframes destello {
            0% { box-shadow: 0 0 0px var(--color-exito); }
            50% { box-shadow: 0 0 20px var(--color-exito); border-color: var(--color-exito); }
            100% { box-shadow: 0 0 0px var(--color-exito); }
        }
        .nueva-puja {
            animation: destello 1s ease-out;
        }
    </style>
</head>
<body>
 
    <main class="container px-4 mt-5 pt-4"> 
        <div class="row mb-5 align-items-center text-center">             
            <div class="col-12">                 
                <h2 class="mb-3 fw-bold" style="color: var(--color-principal); font-size: 3rem;">Subastas Exclusivas</h2>
                <p class="text-muted fs-5">Puja por artículos raros de colección, réplicas y ediciones limitadas. ¡El mayor postor se lo lleva!</p>
            </div>             
        </div>         

        <div id="contenedor-subastas" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
            <!-- Las subastas se inyectarán aquí mediante JS -->
            <div class="col-12 text-center py-5 w-100">
                <div class="spinner-border text-principal" role="status" style="color: var(--color-principal);"></div>
                <p class="mt-3 text-muted fs-5">Cargando subastas en vivo...</p>
            </div>
        </div>

    </main>          
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>     
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/subastas.js"></script> 
</body> 
</html>
