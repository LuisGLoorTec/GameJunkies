<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - GameJunkies</title>
    <!-- CSS Bootstrap y Personalizado -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body style="background-color: var(--fondo-oscuro); color: var(--texto-principal);">

    <!-- Contenedor del Navbar dinámico -->
    <div id="navbar-container"></div>

    <main class="container py-5 mt-5">
        <div id="contenedor-detalle-merch">
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <h4 class="mt-3 text-muted">Buscando producto...</h4>
            </div>
        </div>
    </main>

    <!-- Contenedor del Footer dinámico -->
    <div id="footer-container"></div>

    <!-- Scripts Core -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Scripts Propios -->
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/asistente.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <script src="../JavaScript/datosMerch.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const parametrosUrl = new URLSearchParams(window.location.search);
            const idMerch = parametrosUrl.get('id');
            const contenedorDetalle = document.getElementById('contenedor-detalle-merch');
            
            if (idMerch && typeof catalogoMerch !== 'undefined') {
                const producto = catalogoMerch.find(item => item.id === idMerch);
                
                if (producto) {
                    const htmlDetalle = `
                        <div class="row p-4 rounded shadow-lg border" style="background-color: var(--panel-oscuro) !important; border-color: var(--borde-sutil) !important;">
                            <div class="col-md-5 mb-4 mb-md-0 d-flex align-items-center justify-content-center" style="background-color: #1a1a1a; border-radius: 8px;">
                                <img src="../img/merch/${producto.img}" class="img-fluid rounded" alt="${producto.nombre}" style="max-height: 500px; object-fit: contain;">
                            </div>
                            
                            <div class="col-md-7 d-flex flex-column ps-md-5">
                                <span class="badge mb-2 align-self-start" style="background-color: var(--color-secundario); font-size: 1rem;">${producto.categoria}</span>
                                <h1 class="mb-3 fw-bold" style="color: var(--texto-principal);">${producto.nombre}</h1>
                                
                                <div class="mb-4">
                                    <h3 class="fw-bold text-precio" style="font-size: 3rem; color: var(--color-naranja) !important;">$${producto.precio}</h3>
                                </div>

                                <p class="mb-5" style="color: var(--texto-apagado); line-height: 1.8; font-size: 1.1rem;">
                                    ${producto.descripcion}
                                </p>
                                
                                <div class="mt-auto pt-4 d-flex flex-column flex-md-row gap-3">
                                    <button class="btn btn-lg fw-bold flex-grow-1 d-flex align-items-center justify-content-center gap-2" 
                                            style="background-color: var(--color-secundario); color: #ffffff; transition: all 0.3s ease; border-radius: 8px;"
                                            onclick="if(window.agregarAlCarrito) window.agregarAlCarrito('${producto.id}', '${producto.nombre}', '${producto.precio}', '../img/merch/${producto.img}', 'Merch')">
                                        <span class="material-symbols-outlined fs-5">shopping_cart</span> Añadir al Carrito
                                    </button>
                                    <a href="Merch.html" class="btn btn-secundario btn-lg flex-grow-1">Volver a la Tienda</a>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedorDetalle.innerHTML = htmlDetalle;
                } else {
                    contenedorDetalle.innerHTML = '<h2 class="text-center mt-5 text-danger">Error: Producto no encontrado.</h2><div class="text-center mt-4"><a href="Merch.html" class="btn btn-secundario">Volver</a></div>';
                }
            } else {
                contenedorDetalle.innerHTML = '<h2 class="text-center mt-5 text-danger">Error: No se seleccionó ningún producto.</h2><div class="text-center mt-4"><a href="Merch.html" class="btn btn-secundario">Volver</a></div>';
            }
        });
    </script>
</body>
</html>
