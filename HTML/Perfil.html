<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Mi Perfil</title>
    <link rel="icon" href="../img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
    <style>
        .profile-sidebar {
            background-color: var(--panel-oscuro);
            border: 1px solid var(--borde-sutil);
            border-radius: 10px;
            padding: 20px;
        }
        .profile-nav-link {
            color: var(--texto-apagado);
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        .profile-nav-link:hover, .profile-nav-link.active {
            background-color: var(--fondo-oscuro);
            color: var(--color-principal);
            font-weight: bold;
        }
        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--fondo-oscuro);
            border: 3px solid var(--color-principal);
            overflow: hidden;
            margin: 0 auto 20px auto;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
 
    <main class="container px-4 mt-5 pt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold" style="color: var(--color-principal);">Mi Cuenta</h2>
                <p class="text-muted">Gestiona tus datos personales y preferencias.</p>
            </div>
        </div>

        <div class="row g-4 mb-5">
            <!-- Sidebar Navigation -->
            <div class="col-md-3">
                <div class="profile-sidebar shadow-sm">
                    <div class="text-center mb-4">
                        <div class="avatar-container shadow">
                            <img id="avatar-img" src="" alt="User Avatar">
                        </div>
                        <h5 id="sidebar-nombre" class="fw-bold mb-1" style="color: var(--texto-principal);">Cargando...</h5>
                        <p class="text-muted small mb-0">Miembro de GameJunkies</p>
                    </div>
                    <hr style="border-color: var(--borde-sutil);">
                    <nav class="nav flex-column">
                        <a href="Perfil.html" class="profile-nav-link active">👤 Perfil y Ajustes</a>
                        <a href="Historial.html" class="profile-nav-link">📦 Historial de Compras</a>
                        <a href="Favoritos.html" class="profile-nav-link">❤️ Lista de Deseos</a>
                    </nav>
                    <hr style="border-color: var(--borde-sutil);">
                    <button id="btn-eliminar-cuenta" class="btn btn-outline-danger w-100 mt-2">Eliminar Cuenta</button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="col-md-9">
                <div class="card border-0 shadow-sm" style="background-color: var(--panel-oscuro);">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="mb-4 pb-2 border-bottom" style="color: var(--texto-principal); border-color: var(--borde-sutil) !important;">Información Personal</h4>
                        
                        <form id="form-editar-perfil">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label for="perfil-nombre" class="form-label text-muted">Nombre Completo</label>
                                    <input type="text" class="form-control input-busqueda" id="perfil-nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="perfil-email" class="form-label text-muted">Correo Electrónico</label>
                                    <input type="email" class="form-control input-busqueda" id="perfil-email" readonly style="opacity: 0.7; cursor: not-allowed;" title="El correo no se puede modificar">
                                </div>
                                
                                <div class="col-12 mt-5">
                                    <h5 class="mb-3" style="color: var(--texto-principal);">Cambiar Contraseña (Opcional)</h5>
                                </div>
                                <div class="col-md-6 mt-2">
                                    <label for="perfil-password" class="form-label text-muted">Nueva Contraseña</label>
                                    <input type="password" class="form-control input-busqueda" id="perfil-password" placeholder="Dejar en blanco para no cambiar" minlength="6">
                                </div>
                                <div class="col-md-6 mt-2">
                                    <label for="perfil-confirm-password" class="form-label text-muted">Confirmar Nueva Contraseña</label>
                                    <input type="password" class="form-control input-busqueda" id="perfil-confirm-password" placeholder="Repite la nueva contraseña" minlength="6">
                                </div>

                                <div class="col-12 mt-4 text-end">
                                    <button type="submit" class="btn btn-principal px-5 py-2 fw-bold">Guardar Cambios</button>
                                </div>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>     
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script src="../JavaScript/perfil.js"></script> 
</body> 
</html>
