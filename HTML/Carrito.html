<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Mi Carrito</title>
    <link rel="icon" href="../img/icon/espada.png" type="image/png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>
    <main class="container mt-5 mb-5" style="min-height: 60vh;">
        <h2 class="mb-4" style="color: var(--texto-principal);">Mi Carrito de Compras</h2>
        
        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm border-0" style="background-color: var(--panel-oscuro);">
                    <div class="card-body" id="contenedor-items-carrito">
                        
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 sticky-top" style="top: 100px; background-color: var(--panel-oscuro);">
                    <div class="card-body">
                        <h4 class="card-title mb-4" style="color: var(--texto-principal);">Resumen de Pedido</h4>
                        
                        <div class="d-flex justify-content-between mb-2 text-muted">
                            <span>Subtotal (<span id="resumen-cantidad">0</span> items)</span>
                            <span id="resumen-subtotal">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Impuestos (IVA 12%)</span>
                            <span id="resumen-impuestos">$0.00</span>
                        </div>
                        <hr style="border-color: var(--borde-sutil);">
                        <div class="d-flex justify-content-between mb-4">
                            <strong class="fs-5" style="color: var(--texto-principal);">Total a Pagar</strong>
                            <strong class="fs-5 text-precio" id="resumen-total">$0.00</strong>
                        </div>
                        
                        <button id="btn-ir-checkout" class="btn btn-principal w-100 py-2 fs-5" disabled>Proceder al Pago</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/carrito.js"></script>
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/auth.js"></script>
</body>
</html>
