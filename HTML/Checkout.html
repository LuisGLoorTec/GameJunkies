<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameJunkies | Checkout Seguro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/main.css">
</head>
<body>
    <main class="container mt-5 mb-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div class="card shadow-lg border-0 rounded-4" style="background-color: var(--panel-oscuro);">
                    <div class="card-body p-5">
                        <h2 class="mb-4 text-center" style="color: var(--texto-principal);">Completa tu Compra</h2>
                        
                        <form id="form-checkout">
                            <!-- Datos de Contacto -->
                            <h5 class="mb-3 border-bottom pb-2" style="color: var(--color-secundario); border-color: var(--borde-sutil) !important;">Información de Contacto</h5>
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3">
                                    <label for="chk-nombre" class="form-label text-muted">Nombre Completo</label>
                                    <input type="text" class="form-control input-busqueda" id="chk-nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="chk-email" class="form-label text-muted">Correo Electrónico</label>
                                    <input type="email" class="form-control input-busqueda" id="chk-email" required>
                                </div>
                            </div>
                            
                            <!-- Datos de Pago -->
                            <h5 class="mb-3 border-bottom pb-2" style="color: var(--color-secundario); border-color: var(--borde-sutil) !important;">Detalles de Pago</h5>
                            <div class="mb-3">
                                <label for="chk-tarjeta" class="form-label text-muted">Número de Tarjeta</label>
                                <input type="text" class="form-control input-busqueda" id="chk-tarjeta" placeholder="1234 5678 9101 1121" maxlength="19" required>
                                <small class="text-muted">Formato: 16 dígitos</small>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6 mb-3">
                                    <label for="chk-fecha" class="form-label text-muted">Fecha de Expiración</label>
                                    <input type="text" class="form-control input-busqueda" id="chk-fecha" placeholder="MM/YY" maxlength="5" required pattern="(0[1-9]|1[0-2])/[0-9]{2}" title="Debe ser un formato válido de mes y año: MM/YY">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="chk-cvv" class="form-label text-muted">CVV</label>
                                    <input type="password" class="form-control input-busqueda" id="chk-cvv" placeholder="123" maxlength="3" required>
                                </div>
                            </div>
                            
                            <!-- Resumen Integrado -->
                            <div class="alert mb-4" style="background-color: var(--fondo-oscuro); border: 1px solid var(--borde-sutil); color: var(--texto-principal);">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>Total a Pagar:</span>
                                    <strong class="fs-4 text-precio" id="checkout-total-mostrar">Calculando...</strong>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-principal w-100 py-3 fs-5 fw-bold">Confirmar y Pagar</button>
                            <a href="Carrito.html" class="btn btn-secundario w-100 mt-3 py-2">Volver al Carrito</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../JavaScript/layout.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Cargar datos de usuario
            const usuario = JSON.parse(localStorage.getItem('usuarioActual'));
            if (!usuario) {
                window.location.href = 'Login.html';
                return;
            }
            
            document.getElementById('chk-nombre').value = usuario.nombre || '';
            document.getElementById('chk-email').value = usuario.email || '';

            // Calcular Total del localStorage para mostrarlo
            const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
            if (carrito.length === 0) {
                window.location.href = 'Carrito.html';
                return;
            }
            
            let subtotal = 0;
            carrito.forEach(item => {
                subtotal += parseFloat(item.price) * item.quantity;
            });
            const total = subtotal + (subtotal * 0.12); // IVA
            document.getElementById('checkout-total-mostrar').textContent = '$' + total.toFixed(2);

            // Formateo automático de Tarjeta de Crédito (espacio cada 4 dígitos)
            const inputTarjeta = document.getElementById('chk-tarjeta');
            if (inputTarjeta) {
                inputTarjeta.addEventListener('input', function(e) {
                    let valor = e.target.value.replace(/\D/g, ''); // Remover todo lo que no sea número
                    let valorFormateado = '';
                    for (let i = 0; i < valor.length; i++) {
                        if (i > 0 && i % 4 === 0) {
                            valorFormateado += ' ';
                        }
                        valorFormateado += valor[i];
                    }
                    e.target.value = valorFormateado;
                });
            }

            // Formateo automático de Fecha de Expiración (agregar '/' después de 2 dígitos)
            const inputFecha = document.getElementById('chk-fecha');
            if (inputFecha) {
                inputFecha.addEventListener('input', function(e) {
                    let valor = e.target.value.replace(/\D/g, '');
                    if (valor.length > 2) {
                        valor = valor.substring(0, 2) + '/' + valor.substring(2, 4);
                    }
                    e.target.value = valor;
                });
            }

            // Validación de formulario y pago
            const formCheckout = document.getElementById('form-checkout');
            formCheckout.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Simulación de procesamiento
                const btnSubmit = formCheckout.querySelector('button[type="submit"]');
                btnSubmit.disabled = true;
                btnSubmit.textContent = "Procesando pago...";
                
                setTimeout(() => {
                    // Vaciar el carrito
                    localStorage.removeItem('carrito');
                    
                    if(window.mostrarToast) window.mostrarToast('¡Pago exitoso! Gracias por tu compra.', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'GameJunkies.html';
                    }, 2000);
                }, 2000);
            });
        });
    </script>
</body>
</html>
